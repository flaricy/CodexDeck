name: CodexDeck
options:
  bundleIdPrefix: dev.codexdeck
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  CodexDeck:
    type: application
    platform: iOS
    sources: [CodexDeck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.codexdeck.ios
        INFOPLIST_FILE: CodexDeck/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
  CodexDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CodexDeckUITests]
    dependencies:
      - target: CodexDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.codexdeck.ios.uitests
        TEST_TARGET_NAME: CodexDeck
    scheme:
      testTargets:
        - CodexDeckUITests
